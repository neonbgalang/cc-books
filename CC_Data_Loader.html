const GS_KEY = 'cc_gs_api_url';

function log(msg, cls){
  const d = document.getElementById('log');
  d.style.display = 'block';
  const e = document.createElement('div');
  e.className = cls || 'inf';
  e.textContent = msg;
  d.appendChild(e);
  d.scrollTop = d.scrollHeight;
}

function setProgress(done, total){
  const p = document.getElementById('progress');
  const bar = document.getElementById('progress-bar');
  p.style.display = 'block';
  bar.style.width = Math.round(done/total*100) + '%';
}

async function postGS(url, key, value){
  const resp = await fetch(url, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify({action:'set', key, value})
  });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  if(!json.ok) throw new Error(JSON.stringify(json));
  return json;
}

async function loadData(mode){
  document.getElementById('log').innerHTML = '';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('log').style.display = 'block';
  setProgress(0, 1);

  const apiUrl = document.getElementById('api-url').value.trim() ||
                 localStorage.getItem(GS_KEY) || '';

  if(mode === 'both' && !apiUrl){
    log('No API URL entered -- loading to localStorage only', 'warn');
    mode = 'local';
  }
  if(apiUrl) localStorage.setItem(GS_KEY, apiUrl);

  const keys = Object.keys(DATA);
  let ok = 0, err = 0, done = 0;

  for(const key of keys){
    done++;
    setProgress(done, keys.length);
    const val = DATA[key];
    const serialized = JSON.stringify(val);

    // localStorage -- always
    try{
      // For chunked keys, also store the assembled version
      if(key === 'v2-sales-meta'){
        // Assemble full sales array
        const count = val.count;
        let all = [];
        for(let i = 0; i < count; i++){
          const chunk = DATA['v2-sales-' + i] || [];
          all = all.concat(chunk);
        }
        localStorage.setItem('cc_v2-sales', JSON.stringify(all));
        log('localStorage: v2-sales assembled (' + all.length + ' records)', 'ok');
        ok++;
      } else if(key === 'v2-purch-meta'){
        const count = val.count;
        let all = [];
        for(let i = 0; i < count; i++){
          const chunk = DATA['v2-purch-' + i] || [];
          all = all.concat(chunk);
        }
        localStorage.setItem('cc_v2-purch', JSON.stringify(all));
        log('localStorage: v2-purch assembled (' + all.length + ' records)', 'ok');
        ok++;
      } else if(!key.match(/^v2-(sales|purch)-\d+$/)){
        // Normal key -- store directly
        localStorage.setItem('cc_' + key, serialized);
        const count = Array.isArray(val) ? ' (' + val.length + ' records)' : '';
        log('localStorage: ' + key + count, 'ok');
        ok++;
      }
      // Skip raw chunk keys in localStorage (we stored the assembled version)
    }catch(e){
      log('localStorage error: ' + key + ': ' + e.message, 'err');
      err++;
    }

    // Google Sheets
    if(mode === 'both' && apiUrl){
      // Skip meta keys -- chunks carry the data
      if(key.endsWith('-meta')) continue;
      try{
        const r = await postGS(apiUrl, key, serialized);
        const count = Array.isArray(val) ? ' (' + val.length + ' records)' : '';
        log('Google Sheets: ' + key + count + ' -- ' + r.action, 'ok');
        ok++;
      }catch(e){
        log('Google Sheets error: ' + key + ': ' + e.message, 'err');
        err++;
      }
      // Small delay to avoid hammering the API
      await new Promise(res => setTimeout(res, 300));
    }
  }

  setProgress(keys.length, keys.length);
  const sumEl = document.getElementById('summary');
  sumEl.style.display = 'block';
  sumEl.innerHTML =
    '<strong>' + (err === 0 ? 'All done!' : 'Completed with ' + err + ' error(s).') + '</strong><br>' +
    ok + ' operations succeeded' + (err > 0 ? ', ' + err + ' failed' : '') + '.<br><br>' +
    '<strong>Data loaded:</strong><br>' +
    '&bull; 410 sales transactions (5 chunks x 100)<br>' +
    '&bull; 245 purchase records (4 chunks x 80)<br>' +
    '&bull; 6 supply records<br>' +
    '&bull; 32 fixed assets<br>' +
    '&bull; 92 ingredients with FIFO lots<br>' +
    '&bull; 94 finished goods batches<br>' +
    '&bull; 5 AP + 1 AR opening balances<br><br>' +
    (err === 0
      ? '<strong>Next step:</strong> Open CC_Accounting_GS.html and log in.'
      : '<strong>Tip:</strong> Click the button again to retry -- already-written keys will just be updated.');
}
</script>
